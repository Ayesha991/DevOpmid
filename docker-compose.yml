services:
  mongo:
    image: mongo:7
    container_name: password-manager-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: password-manager-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_NAME: passwordManager
      MONGODB_URI: mongodb://mongo:27017
      FRONTEND_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    container_name: password-manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data: